<div class="mb-4">
  <h1 class="text-2xl font-semibold text-gray-950">Watch Tracker</h1>
  <p class="mt-1 text-sm text-gray-600">
    Browse movies, plan what is next, and keep your watched history tidy.
  </p>
</div>

<div class="rounded-lg border border-gray-200 bg-white p-4 shadow-sm">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">

    <div class="flex flex-wrap items-center gap-2">
      <p-button
        label="Movies"
        icon="pi pi-video"
        [outlined]="!isActive('/')"
        severity="secondary"
        (onClick)="goHome()"
      />

      @if (auth.isLoggedIn()) {
        <p-button
          label="Watchlist"
          [icon]="PrimeIcons.BOOKMARK"
          [outlined]="!isActive('/watchlist')"
          severity="secondary"
          (onClick)="goWatchlist()"
        />

        <p-button
          label="Watched"
          [icon]="PrimeIcons.CHECK"
          [outlined]="!isActive('/watched')"
          severity="secondary"
          (onClick)="goWatched()"
        />

        @if (auth.isAdmin()) {
          <p-button
            label="Admin"
            icon="pi pi-cog"
            [outlined]="!isActive('/admin')"
            severity="secondary"
            (onClick)="goAdmin()"
          />
        }
      }
    </div>

    <div class="flex flex-wrap items-center gap-2 justify-end">
      @if (auth.isLoggedIn()) {
        <p-button
          label="Profile"
          [icon]="PrimeIcons.USER"
          [outlined]="!isActive('/profile')"
          severity="secondary"
          (onClick)="goProfile()"
        />

        <span class="text-sm text-gray-700">
          {{ auth.displayName() }}
        </span>

        <p-tag
          [value]="auth.userRole() | titlecase"
          [severity]="auth.isAdmin() ? 'danger' : 'info'"
        />

        <p-button
          label="Logout"
          icon="pi pi-sign-out"
          severity="secondary"
          (onClick)="logout()"
        />
      } @else {
        <p-button
          label="Login"
          icon="pi pi-sign-in"
          [text]="true"
          (onClick)="goLogin()"
        />

        <p-button
          label="Register"
          icon="pi pi-user-plus"
          (onClick)="goRegister()"
        />
      }
    </div>

  </div>
</div>
