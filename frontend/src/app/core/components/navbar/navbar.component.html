<div class="mb-4">
  <h1 class="text-2xl font-semibold">Watch Tracker</h1>
  <p class="mt-1 text-sm text-gray-600">
    Browse movies and manage your watch list.
  </p>
</div>

<div class="rounded-2xl bg-white p-6 shadow">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">

    <div class="flex items-center gap-2">
      <p-button
        label="Movies"
        icon="pi pi-video"
        [text]="true"
        severity="secondary"
        (onClick)="goHome()"
      />

      @if (auth.isLoggedIn()) {
        <p-button
          label="My Watchlist"
          [icon]="PrimeIcons.BOOKMARK"
          [text]="true"
          severity="secondary"
          (onClick)="goWatchlist()"
        />

        @if (auth.isAdmin()) {
          <p-button
            label="Admin"
            icon="pi pi-cog"
            [text]="true"
            severity="secondary"
            (onClick)="goAdmin()"
          />
        }
      }
    </div>

    <div class="flex flex-wrap items-center gap-2 justify-end">
      @if (auth.isLoggedIn()) {
        <p-button
          label="Profile"
          [icon]="PrimeIcons.USER"
          [text]="true"
          severity="secondary"
          (onClick)="goProfile()"
        />

        <span class="text-sm text-gray-700">
          {{ auth.displayName() }}
        </span>

        <p-tag
          [value]="auth.userRole() | titlecase"
          [severity]="auth.isAdmin() ? 'danger' : 'info'"
        />

        <p-button
          label="Logout"
          icon="pi pi-sign-out"
          severity="secondary"
          (onClick)="logout()"
        />
      } @else {
        <p-button
          label="Login"
          icon="pi pi-sign-in"
          [text]="true"
          (onClick)="goLogin()"
        />

        <p-button
          label="Register"
          icon="pi pi-user-plus"
          (onClick)="goRegister()"
        />
      }
    </div>

  </div>
</div>
